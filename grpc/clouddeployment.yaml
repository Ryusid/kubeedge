# cloud-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-worker
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: grpc-worker } }
  template:
    metadata: { labels: { app: grpc-worker } }
    spec:
      nodeSelector: { kubernetes.io/hostname: sid-vmware-virtual-platform }
      hostNetwork: true
      containers:
      - name: worker
        image: ryusid/grpc-worker:latest
        env:
        - { name: CLASS_NAMES, value: "cloud1,cloud2,cloud3,cloud4,cloud5" }
        - { name: GRPC_LOGGER, value: "Cloud-GRPC" }
        - { name: GRPC_BIND, value: "0.0.0.0:50051" }
        - { name: INFER_DELAY_MS, value: "10" }
        ports:
        - { name: grpc, containerPort: 50051 }
        readinessProbe: { tcpSocket: { port: 50051 }, initialDelaySeconds: 2, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-worker
  namespace: default
spec:
  type: LoadBalancer  # or NodePort if no LB
  selector: { app: grpc-worker }
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
